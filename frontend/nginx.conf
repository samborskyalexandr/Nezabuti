server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # API → backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads → backend static files
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Favicons: serve built assets directly (avoid stale SSR/proxy edge cases)
    location = /favicon.ico {
        alias /app/dist/nezabuti/browser/favicon.ico;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    location ~* ^/(favicon-\d+x\d+\.png|apple-touch-icon\.png)$ {
        root /app/dist/nezabuti/browser;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        access_log off;
    }

    # Angular SSR (Node) + SPA-compatible routing
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
